name: CI/CD Pipeline-assignment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4

      - name: install dependencies 
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest  
 